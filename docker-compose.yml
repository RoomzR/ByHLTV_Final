services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: byhltv
      POSTGRES_PASSWORD: byhltv
      POSTGRES_DB: byhltv
    volumes:
      - byhltv_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byhltv -d byhltv"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - byhltv_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: byhltv
      MINIO_ROOT_PASSWORD: byhltvsecret
    volumes:
      - byhltv_minio:/data

volumes:
  byhltv_pg:
  byhltv_redis:
  byhltv_minio:
